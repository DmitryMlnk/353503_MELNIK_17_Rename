<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoService - Settings</title>
    <script>
        function validateForm() {
            const phone = document.getElementById('phone_number').value;
            const phonePattern = /^\+375\((?:25|29|33|44)\)\d{3}-\d{2}-\d{2}$/;
            if (!phonePattern.test(phone)) {
                alert('Phone number must be in format +375(29)XXX-XX-XX');
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <p><a href="/">Home</a></p>
    <h1>Account Settings for {{ user.username }}</h1>
    <form method="post" onsubmit="return validateForm()">
        {% csrf_token %}
        <p>
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" value="{{ user_client.address }}">
        </p>
        <p>
            <label for="phone_number">Phone Number:</label>
            <input type="text" id="phone_number" name="phone_number" value="{{ user_client.phone_number }}">
        </p>
        <button type="submit">Save</button>
        <a href="/">Cancel</a>
    </form>
</body>
</html>
