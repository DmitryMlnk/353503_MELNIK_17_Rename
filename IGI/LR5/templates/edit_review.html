<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать отзыв</title>
</head>
<body>
    <p><a href="/">Home</a></p>
    <h1>Редактировать отзыв</h1>
    <form id="edit-form">
        {% csrf_token %}
        <label for="text">Текст отзыва:</label><br>
        <textarea name="text" required>{{ review.text }}</textarea><br>
        <label for="rating">Рейтинг (0-10):</label><br>
        <input type="number" name="rating" min="0" max="10" value="{{ review.rating }}" required><br>
        <button type="submit">Сохранить изменения</button>
    </form>
    <p><a href="/review_list/">Назад к списку отзывов</a></p>

    <script>
        document.getElementById('edit-form').onsubmit = function(event) {
            event.preventDefault();

            const formData = new FormData(this);
            const reviewId = "{{ review.id }}";
            const data = {
                text: formData.get('text'),
                rating: formData.get('rating')
            };

            fetch(`/review_list/edit_review/${reviewId}/`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = '/review_list/';
                } else {
                    alert('Ошибка при обновлении отзыва.');
                }
            });
        };
    </script>
</body>
</html>
