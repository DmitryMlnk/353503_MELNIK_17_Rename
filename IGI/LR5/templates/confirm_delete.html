<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удалить отзыв</title>
</head>
<body>
    <p><a href="/">Home</a></p>
    <h1>Удалить отзыв</h1>
    <p>Вы уверены, что хотите удалить отзыв с ID {{ review.id }}?</p>
    <form id="delete-form">
        {% csrf_token %}
        <button type="submit">Удалить</button>
    </form>
    <p><a href="/review_list/">Назад к списку отзывов</a></p>

    <script>
        document.getElementById('delete-form').onsubmit = function(event) {
            event.preventDefault();

            const reviewId = "{{ review.id }}";

            fetch(`/review_list/delete_review/${reviewId}/`, {
                method: 'DELETE',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                }
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = '/review_list/';
                } else {
                    alert('Ошибка при удалении отзыва.');
                }
            });
        };
    </script>
</body>
</html>
